<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Food System</title>
    <link rel="icon" href="./assets/favicon.webp" type="image/webp" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="first-run" aria-label="Initial Food System setup">
      <section class="first-run__intro">
        <div class="first-run__intro-copy">
          <h1 data-copy="headline">Organize your<br />restaurant</h1>
          <p data-copy="intro">Orders, menu and operations in one place</p>
        </div>
      </section>
      <section class="first-run__setup" aria-labelledby="setupTitle">
        <div class="first-run__form-wrap">
          <h2 id="setupTitle" data-copy="title">Set up your business</h2>
          <form id="firstRunForm">
            <label class="first-run__field" for="businessName">
              <span data-copy="businessLabel">Business name</span>
              <input id="businessName" name="businessName" type="text" autocomplete="organization" placeholder="e.g. Market Street Cafe" minlength="2" maxlength="160" required />
            </label>
            <p id="setupError" class="first-run__error" role="alert" tabindex="-1" hidden></p>
            <button class="first-run__submit" type="submit"><span data-copy="submit">Continue</span></button>
          </form>
          <div class="first-run__terms">
            <input id="termsAgreement" name="termsAgreement" type="checkbox" required />
            <label for="termsAgreement" data-copy="termsPrefix">Concordo com os</label>
            <button class="first-run__terms-link" id="openTerms" type="button" data-copy="termsLink">termos</button>
            <span data-copy="termsSuffix">de uso da aplicação</span>
          </div>
        </div>
      </section>
    </main>
    <div class="first-run__terms-modal" id="termsModal" hidden>
      <button class="first-run__terms-backdrop" type="button" aria-label="Close terms" data-close-terms></button>
      <section class="first-run__terms-panel" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
        <button class="first-run__terms-close" type="button" aria-label="Close terms" data-close-terms>×</button>
        <h2 id="termsTitle" data-copy="termsTitle">Termos de uso</h2>
        <div id="setupTermsBody" class="first-run__terms-content"></div>
      </section>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
