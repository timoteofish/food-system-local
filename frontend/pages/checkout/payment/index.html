<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento | Food System</title>
    <link rel="icon" href="../../../assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="../../../styles/base.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../../styles/app-responsive.css" />
    <link rel="stylesheet" href="../../../styles/minimal-polish.css" />


  </head>
  <body class="payment-page">
    <main class="shell">
      <section class="payment-panel panel">
        <div class="payment-head">
          <p class="eyebrow">Pagamento</p>
          <h1>Finalize seu plano</h1>
          <p>Escolha a forma de pagamento para liberar o painel da sua operação</p>
        </div>
        <div class="plan-summary">
          <div class="plan-summary__header">
            <span>Plano selecionado</span>
            <span class="plan-source-badge" id="planSourceBadge" hidden></span>
          </div>
          <div class="selected-plan-card" id="selectedPlanCard">
            <div class="selected-plan-card__main">
              <h2 class="selected-plan-card__name" id="selectedPlanName">Carregando</h2>
              <div class="selected-plan-card__price">
                <strong id="selectedPlanPrice">—</strong>
              </div>
            </div>
          </div>
        </div>
        <form class="payment-form" id="paymentForm">
          <div class="field">
            <label>Forma de pagamento</label>
            <div class="payment-methods" role="tablist" aria-label="Formas de pagamento">
              <button type="button" class="payment-method active" data-method="pix" aria-pressed="true" aria-label="Pix">
                <span class="payment-method__label">Pix</span>
              </button>
              <button type="button" class="payment-method" data-method="credit" aria-pressed="false" aria-label="Cartão de crédito">
                <span class="payment-method__label">Crédito</span>
              </button>
              <button type="button" class="payment-method" data-method="debit" aria-pressed="false" aria-label="Cartão de débito">
                <span class="payment-method__label">Débito</span>
              </button>
            </div>
            <input type="hidden" id="method" name="method" value="pix" />
          </div>
          <div class="field">
            <label for="holder">Nome no pagamento</label>
            <input id="holder" type="text" placeholder="Nome da empresa ou titular" />
          </div>
          <div class="payment-details" aria-live="polite"></div>
          <p id="paymentFeedback" class="form-feedback form-feedback--error" hidden></p>
          <button class="btn btn--primary" type="submit" id="submitButton">Confirmar pagamento</button>
        </form>
        <button class="btn btn--secondary payment-back" type="button" onclick="window.location.href='../plans/index.html'">Escolher outro plano</button>
      </section>
    </main>
    <script src="../../../env.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
