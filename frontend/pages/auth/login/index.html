<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food System</title>
    <link rel="icon" href="../../../assets/favicon.webp" type="image/webp" />
<link rel="stylesheet" href="../../../styles/base.css" />
    <link rel="stylesheet" href="../../../styles/theme.css" />
    <link rel="stylesheet" href="../../../styles/app-responsive.css" />
    <link rel="stylesheet" href="../../../styles/minimal-polish.css" />
    <link rel="stylesheet" href="./styles.css" />
      <script type="module" src="../../../shared/ui/appearance-boot.js"></script>
  </head>
  <body class="login-page">
    <main class="shell">
      <section class="login-panel">
        <div class="auth-copy">
          <p class="eyebrow">Food System</p>
          <h1>Sign in</h1>
          <p class="subtitle">Sign in to your business dashboard</p>
        </div>
        <form class="auth-form" id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
          </div>
          <div class="login-options">
            <label><input type="checkbox" id="rememberMe" /> Remember me</label>
            <a href="../forgot-password/index.html" class="forgot-link">Forgot password?</a>
          </div>
          <p id="loginFeedback" class="form-feedback form-feedback--error" role="alert" aria-live="polite" hidden></p>
          <button class="btn btn--primary" type="submit">Sign in to dashboard</button>
          <div class="social-row">
            <div class="divider">or</div>
            <div id="googleSignInBtn" class="social-icon"></div>
          </div>
        </form>
        <div class="auth-switch">
          <span>Don't have an account?</span>
          <a href="../register/index.html">Create an account</a>
        </div>
      </section>
    </main>
    <script src="../../../env.js"></script>
    <script type="module" src="../../../shared/i18n/legacy-control.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
