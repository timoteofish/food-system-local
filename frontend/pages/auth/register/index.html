<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Food System</title>
    <link rel="icon" href="../../../assets/favicon.webp" type="image/webp" />
<link rel="stylesheet" href="../../../styles/base.css" />
    <link rel="stylesheet" href="../../../styles/theme.css" />
    <link rel="stylesheet" href="../../../styles/app-responsive.css" />
    <link rel="stylesheet" href="../../../styles/minimal-polish.css" />
    <link rel="stylesheet" href="./styles.css" />
      <script type="module" src="../../../shared/ui/appearance-boot.js"></script>
  </head>
  <body class="register-page">
    <main class="shell">
      <section class="register-layout">
        <section class="signup-panel">
          <div class="auth-copy">
            <p class="eyebrow">Food System</p>
            <h1>Create account</h1>
            <p class="subtitle">Create your account to set up Food System</p>
          </div>
          <form class="auth-form" id="registerForm">
            <div class="field">
              <label for="fullName">Full name</label>
              <input id="fullName" type="text" placeholder="Your full name" required />
            </div>
            <div class="field">
              <label for="registerEmail">Email</label>
              <input id="registerEmail" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="registerPassword">Password</label>
              <input id="registerPassword" type="password" placeholder="Create a password" minlength="8" maxlength="1024" required />
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" type="password" placeholder="Re-enter your password" required />
              <div id="passwordError" class="error-message">Passwords do not match</div>
            </div>
            <div class="terms">
              <input type="checkbox" id="termsAgreement" />
              <label for="termsAgreement">
                I agree to the
                <button type="button" class="terms-link" id="openTerms">Terms of service</button>
              </label>
            </div>
            <p id="registerFeedback" class="form-feedback form-feedback--error" hidden></p>
            <button class="btn btn--primary" type="submit">Next step</button>
          </form>
          <div class="divider auth-divider">or</div>
          <div id="googleSignInBtnRegister"></div>
          <div class="auth-switch">
            <span>Already have an account?</span>
            <a href="../login/index.html">Go to sign in</a>
          </div>
        </section>
      </section>
    </main>
    <div class="terms-modal" id="termsModal" hidden>
      <div class="terms-modal__backdrop" data-action="close-terms"></div>
      <section class="terms-panel" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
        <div class="terms-panel__header">
          <div>
            <p class="eyebrow">Food System</p>
            <h2 id="termsTitle">Terms of service</h2>
          </div>
        </div>
        <div class="terms-panel__body" id="termsBody"></div>
        <div class="terms-panel__footer">
          <button type="button" class="btn btn--secondary terms-back" data-action="close-terms">Back</button>
        </div>
      </section>
    </div>
    <script src="../../../env.js"></script>
    <script type="module" src="../../../shared/i18n/legacy-control.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
