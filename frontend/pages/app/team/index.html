        <div class="page-title">
          <div>
            <p class="eyebrow">Acessos</p>
            <h1>Equipe</h1>
          </div>
        </div>
        <section class="team-layout">
          <form class="panel team-invite" id="teamInviteForm">
            <h2>Adicionar acesso</h2>
            <label class="field">
              <span>Nome</span>
              <input id="memberName" autocomplete="name" placeholder="Nome do colaborador" required />
            </label>
            <label class="field">
              <span>E-mail</span>
              <input id="memberEmail" type="email" autocomplete="email" placeholder="email@restaurante.com" required />
            </label>
            <label class="field">
              <span>Papel</span>
              <select id="memberRole" required>
                <option value="manager">Gerente</option>
                <option value="cashier">Caixa</option>
                <option value="kitchen">Cozinha</option>
                <option value="viewer">Leitura</option>
              </select>
            </label>
            <button class="btn btn--primary" type="submit">Adicionar pessoa</button>
          </form>
          <section class="panel team-list">
            <div class="team-list__head">
              <h2>Pessoas com acesso</h2>
              <span id="teamCount">0 membros</span>
            </div>
            <div class="team-list__items" id="teamList"></div>
          </section>
        </section>
      </main>
