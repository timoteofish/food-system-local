      <aside class="menu-sidebar">

        <nav class="menu-sidebar__nav" aria-label="Navegação principal">

        <div class="profile menu-sidebar__profile">
          <button class="profile-btn" type="button" aria-label="Perfil"><svg class="profile-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12.2a4.6 4.6 0 1 0-4.6-4.6 4.61 4.61 0 0 0 4.6 4.6Zm0 2.2c-4.15 0-7.5 2.52-7.5 5.62V21h15v-1c0-3.1-3.35-5.6-7.5-5.6Z"/></svg></button>

          <div class="profile-menu">
            <a href="../user-edit/index.html">Alterar dados</a>

            <a href="#" data-action="close-app">Fechar aplicação</a>
          </div>
        </div>
      </aside>
      <main class="content menu-content">
        <div class="page-title"><div><p class="eyebrow">Produtos</p><h1>Gerenciar produtos</h1></div></div>
        <section class="panel product-form-panel">
          <form class="product-form" id="productForm">
            <div class="field field--image-inline">
              <label for="productImage">Imagem do produto</label>
              <div class="image-preview">
                <input id="productImage" type="hidden" />
                <div class="image-picker-button image-picker-button--square" id="openImageUserPanel" role="button" tabindex="0" aria-label="Adicionar ou editar imagem do produto">
                  <img id="previewImg" src="" alt="Imagem final do produto" hidden />
                  <span class="image-picker-button__title" id="imagePickerTitle">Adicionar imagem</span>
                </div>
              </div>
            </div>
            <div class="product-form__headline">
              <div class="field field--name"><label for="productName">Nome</label><input id="productName" placeholder="Ex: X-Burger" required /></div>
              <div class="field field--price"><label for="productPrice">Preço</label><input id="productPrice" inputmode="decimal" placeholder="0,00" required /></div>
            </div>
            <div class="field field--category">
              <label for="productCategory">Categoria</label>
              <div class="category-picker">
                <select id="productCategory" style="display:none"></select>
                <button type="button" id="productCategoryButton" class="category-button">Escolher categoria ▾</button>
                <div class="category-dropdown" id="categoryDropdown" hidden>
                  <div class="category-list" id="categoryList"></div>
                  <div class="category-actions">
                    <button type="button" class="btn btn--secondary" id="addCategory">Adicionar categoria</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="field field--description"><label for="productDescription">Descrição</label><textarea id="productDescription" rows="3"></textarea></div>
            <button class="btn btn--primary field-wide" type="submit">Salvar produto</button>
          </form>
        </section>
        <section class="panel table-panel">
          <div class="table-controls">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 001.48-5.34C15.39 5.59 12.3 3 8.7 3S2 5.59 2 8.39 4.09 13.78 7.69 13.78c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM7.69 12.28C5.1 12.28 3 10.28 3 8.39S5.1 4.5 7.69 4.5 12.38 6.5 12.38 8.39 10.28 12.28 7.69 12.28z"/></svg>
            <input id="productSearch" type="search" placeholder="Pesquisar produtos, categoria ou ID" />
          </div>
          <div class="mobile-product-list" id="mobileProductList" aria-live="polite"></div>
          <table>
            <thead><tr><th>Imagem</th><th>Produto</th><th>ID</th><th>Categoria</th><th>Preço</th><th>Status</th></tr></thead>
            <tbody id="productList"></tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="../../../env.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
