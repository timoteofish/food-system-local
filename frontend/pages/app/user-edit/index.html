<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Food System</title>
    <link rel="icon" href="../../../assets/favicon.webp" type="image/webp" />
<link rel="stylesheet" href="../../../styles/base.css" />
    <link rel="stylesheet" href="../../../styles/app-responsive.css" />
    <link rel="stylesheet" href="../../../styles/minimal-polish.css" />
    <link rel="stylesheet" href="../../../styles/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
      <script type="module" src="../../../shared/ui/appearance-boot.js"></script>
  </head>
  <body>
    <main class="user-edit-page">
      <section class="user-edit-card panel">
        <div class="user-edit-card__header">
          <div>
            <p class="eyebrow">Account</p>
            <h1>My account</h1>
          </div>
          <div class="user-edit-card__header-actions">
            <label class="global-language-control">
              <span>Language</span>
              <select data-global-language aria-label="Language">
                <option value="pt" selected>Portuguese</option>
                <option value="en">English</option>
              </select>
            </label>
            <a class="btn btn--secondary" href="../dashboard/index.html">Back</a>
          </div>
        </div>
        <div class="user-edit-card__content">
          <aside class="user-edit-card__avatar" aria-label="Profile summary">
            <div class="user-edit-card__avatar-frame">
              <img class="user-edit-card__avatar-image" id="userAvatarPreview" alt="Profile photo preview" hidden />
              <span class="user-edit-card__avatar-placeholder" id="userAvatarPlaceholder">U</span>
            </div>
            <div class="user-edit-card__avatar-meta">
              <strong>Profile preview</strong>
              <p class="user-edit-card__avatar-help">The photo appears in this preview only and will not be saved</p>
            </div>
            <input id="userAvatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            <button class="btn btn--secondary" type="button" id="userAvatarButton">Choose a photo to preview</button>
          </aside>
          <div class="user-edit-card__grid">
            <article class="user-edit-card__section user-edit-card__section--form">
              <h2>Account details</h2>
              <div class="user-edit-form">
                <label class="field" for="userName">
                  <span>Name</span>
                  <input id="userName" type="text" autocomplete="name" readonly aria-readonly="true" />
                </label>
                <label class="field" for="userEmail">
                  <span>Email</span>
                  <input id="userEmail" type="email" autocomplete="email" readonly aria-readonly="true" />
                </label>
                <label class="field" for="userPhone">
                  <span>Phone</span>
                  <input id="userPhone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" readonly aria-readonly="true" />
                </label>
              </div>
              <p class="user-edit-card__readonly-note">To change these details, contact support</p>
            </article>
            <article class="user-edit-card__section">
              <h2>Installed application</h2>
              <p>Check the installed version and see whether updates are available</p>
              <button class="btn btn--secondary" type="button" id="checkUpdateButton">Check for updates</button>
              <p id="updateFeedback" role="status" hidden></p>
            </article>
            <article class="user-edit-card__section">
              <h2>Session</h2>
              <p>Close Food System on this computer</p>
              <button class="btn btn--secondary" type="button" data-action="close-app">Close app</button>
            </article>
          </div>
        </div>
      </section>
    </main>
    <script src="../../../env.js"></script>
    <script type="module" src="../../../shared/ui/profile-menu-boot.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
