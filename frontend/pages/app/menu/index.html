<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio | Food System</title>
    <script>
      document.documentElement.dataset.sidebarReady = "false";
      try {
        if (localStorage.getItem("food-system-sidebar-collapsed") === "true") {
          document.documentElement.classList.add("menu-sidebar-collapsed");
        }
      } catch {}
    </script>
    <link rel="icon" href="../../../assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="../../../styles/base.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../../../styles/app-responsive.css" />
    <link rel="stylesheet" href="../../../styles/minimal-polish.css" />


  </head>
  <body>
    <div class="menu-shell">
      <aside class="menu-sidebar">
        <div class="menu-sidebar__brand-row">
          <button class="menu-sidebar__toggle" id="menuSidebarToggle" type="button" aria-label="Minimizar menu">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M4 7h16v2H4V7zm0 4.5h16v2H4v-2zm0 4.5h16v2H4v-2z"/>
            </svg>
          </button>
          <a class="menu-sidebar__brand" href="../dashboard/index.html">Food System QR</a>
        </div>
        <nav class="menu-sidebar__nav" aria-label="Navegação principal">
          <a href="../dashboard/index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-6.2h-5V21H5a1 1 0 0 1-1-1v-8.8z"/>
            </svg>
            <span class="menu-label">Painel</span>
          </a>
          <a href="../products/index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v4h-7V4zM4 13h7v7H4v-7zm9 4h7v3h-7v-3zm0-8h7v5h-7V9z"/>
            </svg>
            <span class="menu-label">Produtos</span>
          </a>
          <a class="active" href="./index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/>
            </svg>
            <span class="menu-label">Cardápio</span>
          </a>
          <a href="../cashier/index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M6 7h12l-1 10H7L6 7zm3-3h6l1 2H8l1-2zM9 10v6h2v-6H9zm4 0v6h2v-6h-2z"/>
            </svg>
            <span class="menu-label">Pagamentos</span>
          </a>
          <a href="../orders/index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M7 4h10l3 3v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1zm0 2H6v12h12V8.2L16.8 6H15v3H9V6H7zm4 0v1h2V6h-2zm-2 7h6v2H9v-2zm0-4h6v2H9V9z"/>
            </svg>
            <span class="menu-label">Pedidos</span>
          </a>
          <a href="../team/index.html">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M16 11a4 4 0 1 0-3.46-6A4 4 0 0 0 8 11a6 6 0 0 0-6 6v2h12v-2a5.96 5.96 0 0 0-1.54-4A5.96 5.96 0 0 1 16 11Zm0 2a4 4 0 0 1 4 4v2h2v-2a6 6 0 0 0-4.02-5.66A4.98 4.98 0 0 1 16 13Z"/>
            </svg>
            <span class="menu-label">Equipe</span>
          </a>
        </nav>
        <div class="profile menu-sidebar__profile">
          <button class="profile-btn" type="button" aria-label="Perfil">F</button>
          <div class="profile-menu">
            <a href="../user-edit/index.html">Alterar dados</a>
            <a href="./index.html">Configurar empresa</a>
            <a href="#" data-action="logout">Sair</a>
          </div>
        </div>
      </aside>
      <main class="content menu-content">
        <div class="page-title">
          <div><p class="eyebrow">Mesas com QR</p><h1>Configurar cardápio e QR</h1></div>
        </div>
        <section class="menu-builder">
          <aside class="panel menu-config">
            <h2>Publicação rápida</h2>
            <div class="field"><label for="businessName">Nome que aparece no QR</label><input id="businessName" placeholder="Ex: Sabor da Serra" /></div>
            <div class="field"><label for="menuName">Chamada do cardápio</label><input id="menuName" placeholder="Ex: Peca pela mesa, sem baixar app" /></div>
            <div class="field"><label for="menuBanner">Aviso curto para o cliente</label><textarea id="menuBanner" rows="3" placeholder="Ex: Pedido direto para a equipe"></textarea></div>
            <div class="field"><label for="primaryColor">Cor da marca</label><input id="primaryColor" type="color" /></div>
            <input id="gradientStart" type="hidden" />
            <input id="gradientEnd" type="hidden" />
            <input id="gradientAngle" type="hidden" />
            <input id="visualStyle" type="hidden" value="clean" />
            <input id="heroMood" type="hidden" value="minimal" />
            <input id="menuDensity" type="hidden" value="42" />
            <div class="menu-categories">
              <div class="menu-categories__head">
                <p class="menu-categories__title">Categorias</p>
                <label class="menu-switch menu-switch--inside">
                  <input id="showAllProducts" type="checkbox" />
                  <span>Mostrar todos os produtos</span>
                </label>
                <p class="field-hint">Desmarque para escolher categorias</p>
              </div>
              <div class="category-list category-list--menu" id="categoryList"></div>
            </div>
            <div class="table-shortcuts" aria-label="Mesas rápidas">
              <strong>Mesas rápidas</strong>
              <div id="tableShortcutList"></div>
            </div>
          </aside>
          <section class="preview-area">
            <div class="browser-window">
              <div class="browser-bar"><span></span><span></span><span></span><strong>Cardápio</strong></div>
              <div class="menu-preview" id="menuPreview">
                <header class="preview-header">
                  <p id="previewBusiness"></p>
                  <h2 id="previewTitle"></h2>
                </header>
                <div class="category-row" id="previewCategories"></div>
                <div class="menu-search">
                  <svg class="menu-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 001.48-5.34C15.39 5.59 12.3 3 8.7 3S2 5.59 2 8.39 4.09 13.78 7.69 13.78c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM7.69 12.28C5.1 12.28 3 10.28 3 8.39S5.1 4.5 7.69 4.5 12.38 6.5 12.38 8.39 10.28 12.28 7.69 12.28z"/></svg>
                  <input id="menuSearch" type="search" placeholder="Pesquisar produto" />
                </div>
                <div class="menu-list" id="menuList"></div>
              </div>
            </div>
            <section class="qr-code-panel panel" id="qrCodePanel" aria-label="QR Code do cardápio">
              <div class="qr-code-panel__header">
                <div>
                  <p class="eyebrow">QR Code</p>
                  <h3>QR por mesa</h3>
                </div>
                <button class="btn btn--secondary menu-qr__button" id="generateQrCode" type="button">Atualizar QR Code</button>
              </div>
              <div class="qr-code-panel__body">
                <label class="field" for="qrCodeTable">
                  <span>Mesa deste QR Code</span>
                  <input id="qrCodeTable" type="text" placeholder="Ex: Mesa 07" />
                </label>
                <img id="qrCodeImage" alt="QR Code do cardápio" />
                <p>Use um QR por mesa</p>
                <div class="qr-code-panel__link-row">
                  <input id="qrCodeLink" type="text" readonly />
                  <button class="qr-code-copy-btn" id="copyQrCodeLink" type="button" aria-label="Copiar link do cardápio" title="Copiar link">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path fill="currentColor" d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H10V7h9v14z"/>
                    </svg>
                  </button>
                </div>
                <div class="qr-code-panel__downloads">
                  <button class="btn btn--secondary" id="downloadQrPng" type="button">Baixar PNG</button>
                  <button class="btn btn--secondary" id="downloadQrJpeg" type="button">Baixar JPEG</button>
                  <button class="btn btn--secondary" id="downloadQrPdf" type="button">Baixar PDF</button>
                </div>
                <button class="btn btn--primary" id="qrCodeOpenPage" type="button">Abrir página final</button>
              </div>
            </section>
          </section>
        </section>
      </main>
    </div>
    <script src="../../../env.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
