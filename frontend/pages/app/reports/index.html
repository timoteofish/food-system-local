<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Reports | Food System</title><link rel="stylesheet" href="../../../styles/base.css"/><link rel="stylesheet" href="../menu/styles.css"/><link rel="stylesheet" href="../../../styles/app-responsive.css"/><link rel="stylesheet" href="../../../styles/minimal-polish.css"/><style>.report-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.report-controls label{display:grid;gap:6px}.report-controls input{padding:9px;border:1px solid #d7dce2;border-radius:8px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.report-value{font-size:1.5rem;font-weight:700}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}@media(max-width:800px){.report-grid{grid-template-columns:1fr}}</style></head><body><div class="menu-shell"><aside class="menu-sidebar"><div class="menu-sidebar__brand-row"><a class="menu-sidebar__brand" href="../dashboard/index.html">Food System</a></div><nav class="menu-sidebar__nav" aria-label="Main navigation"><a href="../dashboard/index.html">Dashboard</a><a href="../orders/index.html">Orders</a><a href="../kitchen/index.html">Kitchen</a><a href="../inventory/index.html">Inventory</a><a class="active" href="./index.html">Reports</a></nav></aside><main class="content menu-content"><div class="page-title"><div><p class="eyebrow">Business intelligence</p><h1>Reports</h1></div></div><section class="panel"><div class="report-controls"><label>From<input type="date" id="fromDate"/></label><label>To<input type="date" id="toDate"/></label><button class="btn btn--primary" id="loadReport" type="button">Load report</button></div></section><section class="report-grid"><article class="panel"><span>Orders</span><div class="report-value" id="orderTotal">0</div></article><article class="panel"><span>Revenue</span><div class="report-value" id="revenueTotal">R$ 0,00</div></article><article class="panel"><span>Average ticket</span><div class="report-value" id="averageTicket">R$ 0,00</div></article></section><section class="panel"><h2>Top products</h2><table class="report-table"><thead><tr><th>Product</th><th>Quantity</th><th>Revenue</th></tr></thead><tbody id="productRows"></tbody></table></section><section class="panel"><h2>Critical stock</h2><div id="criticalStock"></div></section></main></div><script src="../../../env.js"></script><script type="module" src="./app.js"></script></body></html>
