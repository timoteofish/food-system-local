<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Entregas | Food System</title>
    <link rel="icon" href="../../assets/favicon.webp" type="image/webp" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
      <script type="module" src="../../shared/ui/appearance-boot.js"></script>
  </head>
  <body>
    <main>
      <h1>Minhas entregas</h1>
      <p>Informe o token fornecido pelo estabelecimento para acessar suas entregas</p>
      <form id="tokenForm">
        <label for="courierToken">Token do entregador</label>
        <input id="courierToken" type="password" autocomplete="off" required />
        <div class="actions"><button type="submit">Acessar entregas</button><button class="secondary" id="sendLocation" type="button">Enviar minha localização</button><button class="secondary" id="clearToken" type="button">Sair</button></div>
      </form>
      <p id="message" role="status"></p>
      <section id="deliveries" aria-live="polite"></section>
    </main>
    <script src="../../env.js"></script><script type="module" src="../../shared/i18n/legacy-control.js"></script><script type="module" src="./app.js"></script>
  </body>
</html>
