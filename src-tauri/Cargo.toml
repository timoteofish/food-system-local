[package]
name = "food-system-local"
version = "0.1.0"
description = "Aplicativo local de gestão para estabelecimentos de alimentação"
authors = ["Food System"]
edition = "2021"

[lib]
name = "food_system_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
