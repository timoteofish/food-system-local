default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV.fetch("DATABASE_URL") %>
  prepared_statements: <%= ENV.fetch("DB_PREPARED_STATEMENTS", "false") == "true" %>

development:
  <<: *default

test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"] %>

production:
  <<: *default
