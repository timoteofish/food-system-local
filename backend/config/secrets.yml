development:
  jwt_secret_key: <%= ENV.fetch("JWT_SECRET_KEY", "dev_secret_key_change_in_production") %>
  secret_key_base: <%= ENV.fetch("SECRET_KEY_BASE", "dev_secret_key_base_change_in_production_0123456789abcdef") %>

test:
  jwt_secret_key: test_jwt_secret_key
  secret_key_base: test_secret_key_base_0123456789abcdef

production:
  jwt_secret_key: <%= ENV["JWT_SECRET_KEY"] %>
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
